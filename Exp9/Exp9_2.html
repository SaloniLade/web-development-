<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="Exp9_2.css">
</head>
<body>

<div class="form-container">
    <h2>Employee Registration Form</h2>

    <div class="student-info">
        Name: Saloni Nandkumar Lade<br>
        Roll No: 131
    </div>

    <form>
        <table>
            <tr>
                <td>Employee Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter your email"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter password"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>
                    <select>
                        <option>Select Department</option>
                        <option>HR</option>
                        <option>IT</option>
                        <option>Finance</option>
                        <option>Marketing</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Skills</td>
                <td>
                    <input type="checkbox"> HTML
                    <input type="checkbox"> Java
                    <input type="checkbox"> Python
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td><textarea rows="3" placeholder="Enter address"></textarea></td>
            </tr>

            <tr>
                <td>Contact</td>
                <td><input type="tel" placeholder="Enter contact number"></td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>
</div>

</body>
</html>
